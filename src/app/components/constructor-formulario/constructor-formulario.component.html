<div class="fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-4" role="dialog" aria-modal="true" [attr.aria-label]="titulo">
    <div class="absolute inset-0 bg-zinc-900/40" (click)="cerrar.emit()"></div>
    <form (ngSubmit)="enviar()" class="animate-fade-up relative flex max-h-[94dvh] w-full max-w-2xl flex-col rounded-t-3xl bg-white shadow-2xl sm:rounded-2xl">
      <div class="flex items-center justify-between gap-3 border-b border-zinc-100 px-5 py-4">
        <h2 class="text-lg font-extrabold tracking-tight">{{ titulo }}</h2>
        <button type="button" (click)="cerrar.emit()" aria-label="Cerrar" class="flex h-9 w-9 items-center justify-center rounded-lg text-zinc-400 transition hover:bg-zinc-100"><i class="ph ph-x text-lg"></i></button>
      </div>
      <div class="flex-1 space-y-5 overflow-y-auto px-5 py-5">
        <div>
          <label for="f-titulo" class="mb-1.5 block text-xs font-semibold text-zinc-500">Título</label>
          <input id="f-titulo" name="f-titulo" [(ngModel)]="form.titulo" type="text" maxlength="150" class="w-full rounded-xl border border-zinc-300 px-4 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10" />
        </div>
        <div>
          <label for="f-desc" class="mb-1.5 block text-xs font-semibold text-zinc-500">Mensaje para la persona <span class="font-normal text-zinc-400">(opcional)</span></label>
          <textarea id="f-desc" name="f-desc" [(ngModel)]="form.descripcion" rows="2" maxlength="1000" class="w-full resize-none rounded-xl border border-zinc-300 px-4 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10"></textarea>
        </div>

        <div>
          <p class="mb-2 text-sm font-bold">Preguntas</p>
          <div *ngFor="let c of form.campos; let i = index" class="mb-3 rounded-xl border border-zinc-200 p-4">
            <div class="grid gap-3 sm:grid-cols-3">
              <div class="sm:col-span-2">
                <label [for]="'q-et-' + i" class="mb-1 block text-xs font-semibold text-zinc-500">Pregunta {{ i + 1 }}</label>
                <input [id]="'q-et-' + i" [name]="'q-et-' + i" [(ngModel)]="c.etiqueta" type="text" maxlength="150" placeholder="Ej. Nombre completo" class="w-full rounded-xl border border-zinc-300 px-3 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10" />
              </div>
              <div>
                <label [for]="'q-ti-' + i" class="mb-1 block text-xs font-semibold text-zinc-500">Tipo</label>
                <select [id]="'q-ti-' + i" [name]="'q-ti-' + i" [(ngModel)]="c.tipo" class="w-full rounded-xl border border-zinc-300 bg-white px-3 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10">
                  <option *ngFor="let t of tiposCampo" [value]="t.valor">{{ t.etiqueta }}</option>
                </select>
              </div>
            </div>
            <div *ngIf="usaOpciones(c)" class="mt-3">
              <label [for]="'q-op-' + i" class="mb-1 block text-xs font-semibold text-zinc-500">Opciones (una por línea)</label>
              <textarea [id]="'q-op-' + i" [name]="'q-op-' + i" [(ngModel)]="c.opcionesTexto" rows="3" class="w-full resize-none rounded-xl border border-zinc-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10"></textarea>
            </div>
            <div *ngIf="c.tipo === 'archivo'" class="mt-3">
              <label [for]="'q-mx-' + i" class="mb-1 block text-xs font-semibold text-zinc-500">Máximo de archivos (1 a 10)</label>
              <input [id]="'q-mx-' + i" [name]="'q-mx-' + i" [(ngModel)]="c.max" type="number" min="1" max="10" class="w-24 rounded-xl border border-zinc-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10" />
            </div>
            <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
              <label class="flex items-center gap-2 text-sm"><input [name]="'q-rq-' + i" [(ngModel)]="c.requerido" type="checkbox" class="h-4 w-4 rounded border-zinc-300 text-brand-700 focus:ring-brand-600" /> Obligatoria</label>
              <div class="flex gap-1">
                <button type="button" (click)="moverCampo(i, -1)" [disabled]="i === 0" aria-label="Subir pregunta" class="flex h-8 w-8 items-center justify-center rounded-lg text-zinc-500 transition hover:bg-zinc-100 disabled:opacity-30"><i class="ph ph-arrow-up"></i></button>
                <button type="button" (click)="moverCampo(i, 1)" [disabled]="i === form.campos.length - 1" aria-label="Bajar pregunta" class="flex h-8 w-8 items-center justify-center rounded-lg text-zinc-500 transition hover:bg-zinc-100 disabled:opacity-30"><i class="ph ph-arrow-down"></i></button>
                <button type="button" (click)="quitarCampo(i)" aria-label="Quitar pregunta" class="flex h-8 w-8 items-center justify-center rounded-lg text-zinc-400 transition hover:bg-red-50 hover:text-red-600"><i class="ph ph-trash"></i></button>
              </div>
            </div>
          </div>
          <div class="flex flex-wrap gap-2">
            <button type="button" (click)="agregarCampo()" class="inline-flex items-center gap-1.5 rounded-xl border border-dashed border-zinc-300 px-4 py-2.5 text-sm font-semibold text-zinc-600 transition hover:border-brand-500 hover:text-brand-700"><i class="ph ph-plus"></i> Agregar pregunta</button>
            <button type="button" (click)="agregarArchivo()" class="inline-flex items-center gap-1.5 rounded-xl border border-dashed border-zinc-300 px-4 py-2.5 text-sm font-semibold text-zinc-600 transition hover:border-brand-500 hover:text-brand-700"><i class="ph ph-paperclip"></i> Pedir fotos o documentos</button>
          </div>
        </div>
      </div>
      <div class="flex justify-end gap-3 border-t border-zinc-100 px-5 py-4">
        <button type="button" (click)="cerrar.emit()" class="rounded-xl border border-zinc-300 px-4 py-2.5 text-sm font-semibold text-zinc-700 transition hover:bg-zinc-50">Cancelar</button>
        <button type="submit" [disabled]="guardando" class="inline-flex items-center gap-2 rounded-xl bg-brand-700 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-800 active:scale-[0.98] disabled:opacity-60"><i class="ph" [ngClass]="guardando ? 'ph-spinner animate-spin' : 'ph-floppy-disk'"></i> {{ textoGuardar }}</button>
      </div>
    </form>
  </div>

<div class="flex h-full min-h-0 flex-col">
  <div class="min-h-0 flex-1 space-y-3 overflow-y-auto px-4 py-4 sm:px-5" aria-live="polite">
    <div *ngIf="mensajes.length === 0" class="animate-fade-up py-6 text-center">
      <span class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-50 text-brand-700"><i class="ph ph-sparkle text-2xl"></i></span>
      <p class="mt-3 text-sm font-semibold">¿En qué te ayudo?</p>
      <p class="mx-auto mt-1 max-w-xs text-xs text-zinc-500">Puedo leer expedientes, notas, cobros y la agenda, y guardar notas o cobros cuando me lo pidas.</p>
      <div class="mt-4 flex flex-wrap justify-center gap-2">
        <button *ngFor="let s of sugerencias" type="button" (click)="enviar(s)" class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-xs font-semibold text-zinc-700 transition hover:border-brand-600 hover:text-brand-700 active:scale-95">{{ s }}</button>
      </div>
    </div>

    <div *ngFor="let m of mensajes" class="flex" [ngClass]="m.role === 'user' ? 'justify-end' : 'justify-start'">
      <div *ngIf="m.role === 'user'" class="max-w-[85%] whitespace-pre-wrap break-words rounded-2xl rounded-br-md bg-brand-700 px-4 py-2.5 text-sm text-white">{{ m.content }}</div>
      <div *ngIf="m.role === 'assistant'" class="max-w-[92%] break-words rounded-2xl rounded-bl-md px-4 py-2.5 text-sm"
        [ngClass]="m.error ? 'border border-rose-200 bg-rose-50 text-rose-800' : 'bg-zinc-100 text-zinc-800'" [innerHTML]="formatear(m.content)"></div>
    </div>

    <p *ngIf="!pensando && acciones.length" class="flex flex-wrap items-center gap-1.5 text-xs text-zinc-400"><i class="ph ph-check-circle"></i> {{ acciones.join(' · ') }}</p>

    <div *ngIf="pensando" class="flex justify-start" aria-label="Pensando">
      <div class="flex items-center gap-1 rounded-2xl rounded-bl-md bg-zinc-100 px-4 py-3">
        <span class="h-1.5 w-1.5 animate-bounce rounded-full bg-zinc-400"></span><span class="h-1.5 w-1.5 animate-bounce rounded-full bg-zinc-400 [animation-delay:120ms]"></span><span class="h-1.5 w-1.5 animate-bounce rounded-full bg-zinc-400 [animation-delay:240ms]"></span>
      </div>
    </div>
    <div #fin></div>
  </div>

  <form (ngSubmit)="enviar()" class="border-t border-zinc-100 bg-white p-3">
    <div class="flex items-end gap-2">
      <textarea [(ngModel)]="texto" name="mensaje" rows="1" placeholder="Escribe tu pregunta…" aria-label="Mensaje para la IA" (keydown.enter)="alTeclear($event)"
        class="max-h-32 min-h-[2.75rem] flex-1 resize-none rounded-xl border border-zinc-300 px-4 py-3 text-sm placeholder:text-zinc-400 transition focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10"></textarea>
      <button type="submit" [disabled]="pensando || !texto.trim()" aria-label="Enviar"
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-brand-700 text-white transition hover:bg-brand-800 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50"><i class="ph ph-paper-plane-right text-lg"></i></button>
    </div>
    <div class="mt-1.5 flex items-center justify-between px-1 text-[11px] text-zinc-400">
      <span>Enter envía · Mayús+Enter salto de línea</span>
      <button *ngIf="mensajes.length" type="button" (click)="limpiar()" class="font-semibold hover:text-zinc-700">Nueva conversación</button>
    </div>
  </form>
</div>

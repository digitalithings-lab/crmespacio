<article class="flex h-full flex-col border border-zinc-200 bg-white transition duration-200"
  [ngClass]="compacta ? 'rounded-xl p-4' : 'rounded-2xl p-6 hover:-translate-y-0.5 hover:border-zinc-300 hover:shadow-md'">

  <!-- Cabecera: fecha y acciones -->
  <div class="flex items-center justify-between gap-2">
    <span class="text-xs font-medium text-zinc-400">{{ nota.fecha_creacion | date: 'dd/MM/yyyy · HH:mm' }}</span>
    <div *ngIf="!editando && !confirmandoEliminar" class="flex items-center gap-1">
      <button type="button" (click)="iniciarEdicion()" aria-label="Editar nota" title="Editar nota"
        class="flex h-7 w-7 items-center justify-center rounded-lg text-zinc-400 transition hover:bg-zinc-100 hover:text-brand-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600">
        <i class="ph ph-pencil-simple text-base"></i>
      </button>
      <button type="button" (click)="pedirEliminar()" aria-label="Eliminar nota" title="Eliminar nota"
        class="flex h-7 w-7 items-center justify-center rounded-lg text-zinc-400 transition hover:bg-rose-50 hover:text-rose-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-500">
        <i class="ph ph-trash text-base"></i>
      </button>
    </div>
  </div>

  <!-- Vista normal -->
  <ng-container *ngIf="!editando">
    <p class="flex-1 whitespace-pre-line text-sm leading-relaxed text-zinc-700"
      [ngClass]="[compacta ? 'mt-2' : 'mt-3', (!compacta && mostrarCliente) ? 'line-clamp-6' : '']">{{ nota.texto }}</p>

    <!-- Confirmación para eliminar -->
    <div *ngIf="confirmandoEliminar" class="mt-4 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-rose-200 bg-rose-50/70 px-3 py-2.5">
      <span class="text-xs font-semibold text-rose-800">¿Eliminar esta nota?</span>
      <div class="flex items-center gap-2">
        <button type="button" (click)="cancelarEliminar()" [disabled]="guardando"
          class="rounded-lg border border-zinc-200 bg-white px-2.5 py-1 text-xs font-semibold text-zinc-600 transition hover:bg-zinc-50 disabled:opacity-50">
          Cancelar
        </button>
        <button type="button" (click)="eliminar()" [disabled]="guardando"
          class="rounded-lg bg-rose-600 px-2.5 py-1 text-xs font-semibold text-white transition hover:bg-rose-700 disabled:opacity-50">
          {{ guardando ? 'Eliminando…' : 'Eliminar' }}
        </button>
      </div>
    </div>
  </ng-container>

  <!-- Modo edición -->
  <div *ngIf="editando" class="mt-3 space-y-3">
    <div>
      <label class="mb-1 block text-xs font-semibold text-zinc-600">Fecha y hora</label>
      <input type="datetime-local" [(ngModel)]="fechaEdit" [ngModelOptions]="{standalone: true}"
        class="w-full rounded-xl border border-zinc-300 bg-white px-3 py-2 text-xs text-zinc-700 transition focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10" />
    </div>
    <div>
      <label class="mb-1 block text-xs font-semibold text-zinc-600">Nota</label>
      <textarea [(ngModel)]="textoEdit" [ngModelOptions]="{standalone: true}" [attr.rows]="compacta ? 4 : 5"
        class="w-full resize-y rounded-xl border border-zinc-300 bg-white px-3 py-2 text-sm leading-relaxed text-zinc-900 transition focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10"></textarea>
    </div>
    <div class="flex items-center justify-end gap-2">
      <button type="button" (click)="cancelarEdicion()" [disabled]="guardando"
        class="rounded-xl border border-zinc-200 bg-white px-3 py-1.5 text-xs font-semibold text-zinc-600 transition hover:bg-zinc-50 disabled:opacity-50">
        Cancelar
      </button>
      <button type="button" (click)="guardarEdicion()" [disabled]="guardando"
        class="inline-flex items-center gap-1.5 rounded-xl bg-brand-700 px-3.5 py-1.5 text-xs font-semibold text-white transition hover:bg-brand-800 disabled:opacity-50">
        <i *ngIf="guardando" class="ph ph-spinner animate-spin"></i>
        {{ guardando ? 'Guardando…' : 'Guardar cambios' }}
      </button>
    </div>
  </div>

  <!-- Enlace al cliente (solo en vista global de Notas) -->
  <a *ngIf="mostrarCliente" [routerLink]="['/clientes', nota.idexpediente]"
    class="mt-5 flex items-center gap-2 border-t border-zinc-100 pt-4 text-xs font-medium text-zinc-500 transition hover:text-brand-700">
    <i class="ph ph-user text-base"></i>{{ nota.cliente_grupo || (nota.cliente_nombre + ' ' + nota.cliente_apellido) }}
    <i class="ph ph-arrow-right ml-auto"></i>
  </a>
</article>

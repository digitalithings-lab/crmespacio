<div class="flex flex-wrap items-end justify-between gap-4">
  <div>
    <h1 class="text-3xl font-extrabold tracking-tight text-zinc-900">Notas</h1>
    <p class="mt-1 text-sm text-zinc-500">Los apuntes de todos tus clientes.</p>
  </div>
  <button type="button" (click)="nueva()" class="inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-brand-700 to-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm shadow-brand-900/15 transition duration-200 hover:from-brand-800 hover:to-brand-700 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-600/30"><i class="ph ph-plus text-base"></i> Nueva nota</button>
</div>

<div class="mt-6 flex flex-wrap items-center gap-3">
  <div class="relative w-full max-w-md flex-1">
    <i class="ph ph-magnifying-glass pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-lg text-zinc-400"></i>
    <input type="search" [(ngModel)]="busqueda" aria-label="Buscar notas" placeholder="Buscar en las notas o por cliente"
      class="w-full rounded-xl border border-zinc-200 bg-white py-2.5 pl-11 pr-4 text-sm shadow-sm placeholder:text-zinc-400 transition focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10" />
  </div>
  <button type="button" (click)="verFiltro = !verFiltro" [attr.aria-expanded]="verFiltro"
    class="inline-flex items-center gap-2 rounded-xl border border-zinc-200 bg-white px-3.5 py-2.5 text-sm font-semibold text-zinc-600 shadow-sm transition hover:bg-zinc-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600">
    <i class="ph ph-funnel text-base text-brand-700"></i> Filtrar por cliente
  </button>
  <span *ngIf="clienteElegido as e" class="inline-flex items-center gap-2 rounded-full border border-brand-200 bg-brand-50 px-3 py-1.5 text-sm font-semibold text-brand-800">
    {{ e.etiqueta }}
    <button type="button" (click)="elegirCliente(null)" aria-label="Quitar filtro" class="text-brand-700 hover:text-brand-900"><i class="ph ph-x"></i></button>
  </span>
</div>

<div *ngIf="verFiltro" class="animate-fade-up mt-3 max-w-md rounded-2xl border border-zinc-200 bg-white p-4 shadow-sm">
  <app-buscador-cliente [opciones]="opciones" [valor]="clienteFiltro" (valorChange)="elegirCliente($event)"></app-buscador-cliente>
</div>

<!-- Skeleton -->
<div *ngIf="cargando" class="mt-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-3" aria-hidden="true">
  <div *ngFor="let n of [1,2,3]" class="animate-pulse rounded-2xl border border-zinc-200 bg-white p-6">
    <div class="h-3 w-24 rounded bg-zinc-200"></div><div class="mt-4 h-3 w-full rounded bg-zinc-100"></div><div class="mt-2 h-3 w-5/6 rounded bg-zinc-100"></div><div class="mt-2 h-3 w-2/3 rounded bg-zinc-100"></div><div class="mt-6 h-3 w-1/3 rounded bg-zinc-100"></div>
  </div>
</div>

<!-- Vacío -->
<div *ngIf="!cargando && filtradas.length === 0" class="animate-fade-up mt-6 flex flex-col items-center rounded-2xl border-2 border-dashed border-zinc-300 bg-white px-6 py-14 text-center">
  <span class="flex h-12 w-12 items-center justify-center rounded-full bg-brand-50 text-brand-700"><i class="ph ph-note-pencil text-2xl"></i></span>
  <p class="mt-4 font-semibold">{{ notas.length === 0 ? 'Aún no hay notas' : 'Sin resultados' }}</p>
  <p class="mt-1 text-sm text-zinc-500">{{ notas.length === 0 ? 'Usa el botón flotante para escribir una.' : 'Prueba con otra búsqueda.' }}</p>
</div>

<div class="mt-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
  <div *ngFor="let n of filtradas; let i = index" class="animate-fade-up" [style.animation-delay.ms]="(i < 8 ? i : 8) * 45">
    <app-tarjeta-nota [nota]="n" [mostrarCliente]="true"></app-tarjeta-nota>
  </div>
</div>

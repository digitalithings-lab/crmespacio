<div class="relative flex min-h-[100dvh] bg-[#faf8f9] font-sans text-zinc-800 antialiased">

  <!-- Control del menú móvil (sin JS) -->
  <input id="menu-toggle" type="checkbox" class="peer sr-only" />
  <label for="menu-toggle" aria-label="Cerrar menú"
    class="fixed inset-0 z-30 hidden bg-zinc-900/40 backdrop-blur-sm peer-checked:block lg:!hidden"></label>

  <!-- Sidebar -->
  <aside class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col border-r border-zinc-200/80 bg-white p-4 shadow-sm transition-transform duration-300 ease-in-out peer-checked:translate-x-0 lg:sticky lg:top-0 lg:h-[100dvh] lg:w-64 lg:shrink-0 lg:translate-x-0 lg:shadow-none">
    <a routerLink="/dashboard" class="flex items-center gap-3 rounded-xl px-2 py-2.5 transition hover:bg-brand-50/50">
      <img src="assets/img/Logo Espacio Vital.png" alt="Logo Espacio Vital" class="h-10 w-10 shrink-0 object-contain" />
      <div class="min-w-0">
        <p class="truncate text-sm font-extrabold tracking-tight text-brand-900">Espacio Vital</p>
        <p class="truncate text-[11px] font-semibold text-brand-600">CRM Clínico</p>
      </div>
    </a>

    <p class="mt-5 px-3 text-[11px] font-bold uppercase tracking-widest text-zinc-400">Principal</p>
    <nav class="mt-2 min-h-0 flex-1 space-y-1 overflow-y-auto pr-0.5" aria-label="Principal" (click)="$any($event.target).closest('a') && cerrarMenu()">
        <a routerLink="/dashboard" routerLinkActive="!bg-brand-50 !text-brand-800 ring-1 ring-brand-200/80 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-zinc-600 transition duration-200 hover:bg-zinc-100/80 hover:text-zinc-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"><i class="ph ph-house text-xl"></i>Dashboard</a>
        <a routerLink="/agenda" routerLinkActive="!bg-brand-50 !text-brand-800 ring-1 ring-brand-200/80 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-zinc-600 transition duration-200 hover:bg-zinc-100/80 hover:text-zinc-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"><i class="ph ph-calendar-blank text-xl"></i>Agenda</a>
        <a routerLink="/clientes" routerLinkActive="!bg-brand-50 !text-brand-800 ring-1 ring-brand-200/80 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-zinc-600 transition duration-200 hover:bg-zinc-100/80 hover:text-zinc-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"><i class="ph ph-users text-xl"></i>Clientes</a>
        <a routerLink="/notas" routerLinkActive="!bg-brand-50 !text-brand-800 ring-1 ring-brand-200/80 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-zinc-600 transition duration-200 hover:bg-zinc-100/80 hover:text-zinc-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"><i class="ph ph-note-pencil text-xl"></i>Notas</a>

        <p class="px-3 pb-1 pt-4 text-[11px] font-bold uppercase tracking-widest text-zinc-400">Herramientas</p>
        <a routerLink="/biblioteca" routerLinkActive="!bg-brand-50 !text-brand-800 ring-1 ring-brand-200/80 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-zinc-600 transition duration-200 hover:bg-zinc-100/80 hover:text-zinc-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"><i class="ph ph-books text-xl"></i>Biblioteca</a>
        <a routerLink="/biblioteca-personal" routerLinkActive="!bg-brand-50 !text-brand-800 ring-1 ring-brand-200/80 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-zinc-600 transition duration-200 hover:bg-zinc-100/80 hover:text-zinc-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"><i class="ph ph-folder-user text-xl"></i>Biblioteca personal</a>
        <a routerLink="/formularios" routerLinkActive="!bg-brand-50 !text-brand-800 ring-1 ring-brand-200/80 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-zinc-600 transition duration-200 hover:bg-zinc-100/80 hover:text-zinc-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"><i class="ph ph-list-checks text-xl"></i>Formularios</a>
        <a routerLink="/reuniones" routerLinkActive="!bg-brand-50 !text-brand-800 ring-1 ring-brand-200/80 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-zinc-600 transition duration-200 hover:bg-zinc-100/80 hover:text-zinc-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"><i class="ph ph-video-camera text-xl"></i>Reuniones</a>
        <a routerLink="/chat-ia" routerLinkActive="!bg-brand-50 !text-brand-800 ring-1 ring-brand-200/80 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-zinc-600 transition duration-200 hover:bg-zinc-100/80 hover:text-zinc-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"><i class="ph ph-sparkle text-xl"></i>Chat con IA</a>
    </nav>

    <div class="mt-3 flex shrink-0 items-center gap-3 rounded-2xl border border-zinc-200/80 bg-zinc-50/80 p-3">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-brand-700 to-brand-500 text-sm font-bold text-white shadow-sm">{{ (nombre?.[0] || 'U') | uppercase }}</div>
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-zinc-900">{{ nombre }} {{ apellido }}</p>
        <p class="truncate text-xs text-zinc-500">{{correo}}</p>
      </div>
      <a routerLink="/login" (click)="cerrarSesion()" aria-label="Cerrar sesión" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-zinc-400 transition hover:bg-brand-50 hover:text-brand-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"><i class="ph ph-sign-out text-lg"></i></a>
    </div>
  </aside>

  <!-- Contenido -->
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-zinc-200 bg-white/80 px-4 backdrop-blur sm:px-8">
      <label for="menu-toggle" aria-label="Abrir menú" class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-xl text-zinc-600 hover:bg-zinc-100 lg:hidden"><i class="ph ph-list text-2xl"></i></label>
      <div class="relative max-w-md flex-1">
        <i class="ph ph-magnifying-glass pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-lg text-zinc-400"></i>
        <input type="search" [(ngModel)]="busqueda" name="busquedaClientes" autocomplete="off" placeholder="Buscar cliente…" aria-label="Buscar cliente"
          (focus)="alEnfocarBusqueda()" (blur)="buscando = false"
          class="w-full rounded-xl border border-zinc-200 bg-zinc-50 py-2.5 pl-11 pr-4 text-sm placeholder:text-zinc-400 transition focus:border-brand-600 focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-600/10" />
        <ul *ngIf="buscando" class="absolute left-0 right-0 top-full z-30 mt-2 max-h-72 overflow-y-auto rounded-xl border border-zinc-200 bg-white py-1 shadow-lg" role="listbox" aria-label="Clientes">
          <li *ngFor="let o of resultados" role="option">
            <button type="button" (mousedown)="irACliente(o)" class="flex w-full items-center gap-2 px-4 py-2.5 text-left text-sm text-zinc-700 transition hover:bg-zinc-50">
              <i class="ph ph-user text-base text-zinc-400"></i><span class="truncate">{{ o.etiqueta }}</span>
            </button>
          </li>
          <li *ngIf="resultados.length === 0" class="px-4 py-4 text-center text-sm text-zinc-500">Ningún cliente coincide</li>
        </ul>
      </div>
      <button type="button" aria-label="Notificaciones" class="relative ml-auto flex h-10 w-10 items-center justify-center rounded-xl text-zinc-600 transition hover:bg-zinc-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600">
        <i class="ph ph-bell text-xl"></i>
        <span class="absolute right-2.5 top-2.5 h-2 w-2 rounded-full bg-brand-500 ring-2 ring-white"></span>
      </button>
    </header>

    <main class="mx-auto w-full min-w-0 max-w-7xl flex-1 overflow-x-clip p-4 pb-32 sm:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Nota flotante en todas las páginas -->
  <app-nota-flotante></app-nota-flotante>
  <!-- Burbuja de recordatorios en todas las páginas -->
  <app-recordatorios></app-recordatorios>
</div>

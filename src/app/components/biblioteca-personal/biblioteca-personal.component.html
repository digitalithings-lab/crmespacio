<div class="flex flex-wrap items-end justify-between gap-4">
  <div>
    <h1 class="text-3xl font-extrabold tracking-tight">Biblioteca personal</h1>
    <p class="mt-1 text-sm text-zinc-500">Tus archivos, sin unirlos a ningún cliente.</p>
  </div>
</div>

<label for="bp-archivo" (dragover)="alArrastrar($event)" (dragleave)="arrastrando = false" (drop)="alSoltar($event)"
  class="mt-8 flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed bg-white px-6 py-8 text-center transition duration-200"
  [ngClass]="arrastrando ? 'scale-[1.01] border-brand-500 bg-brand-50/60' : 'border-zinc-300 hover:border-brand-500 hover:bg-brand-50/40'">
  <span class="flex h-12 w-12 items-center justify-center rounded-full bg-brand-50 text-brand-700"><i class="ph text-2xl" [ngClass]="subiendo ? 'ph-spinner animate-spin' : 'ph-cloud-arrow-up'"></i></span>
  <span class="mt-4 text-sm font-semibold">{{ subiendo ? 'Subiendo archivos…' : 'Arrastra archivos aquí o' }} <span *ngIf="!subiendo" class="text-brand-700">selecciónalos</span></span>
  <span class="mt-1 text-xs text-zinc-500">Hasta 4 MB por archivo</span>
  <input id="bp-archivo" type="file" multiple class="sr-only" [disabled]="subiendo" (change)="alElegir($event)" />
</label>

<div class="mt-8 flex flex-wrap gap-2" role="group" aria-label="Filtrar por tipo">
  <button *ngFor="let f of filtros" type="button" (click)="filtro = f"
    class="rounded-full px-4 py-1.5 text-sm font-semibold transition duration-200 active:scale-95"
    [ngClass]="filtro === f ? 'bg-brand-700 text-white' : 'border border-zinc-200 bg-white text-zinc-600 hover:bg-zinc-50'">{{ f }}</button>
</div>

<div *ngIf="cargando" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" aria-hidden="true">
  <div *ngFor="let n of [1,2,3,4]" class="animate-pulse rounded-2xl border border-zinc-200 bg-white p-4"><div class="h-28 rounded-xl bg-zinc-200"></div><div class="mt-3 h-3.5 w-2/3 rounded bg-zinc-200"></div><div class="mt-2 h-3 w-1/2 rounded bg-zinc-100"></div></div>
</div>

<p *ngIf="!cargando && filtrados.length === 0" class="animate-fade-up mt-8 text-center text-sm text-zinc-500">{{ archivos.length === 0 ? 'Aún no has subido archivos personales.' : 'No hay archivos de este tipo.' }}</p>

<div class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
  <a *ngFor="let a of filtrados; let i = index" [attr.href]="a.url" target="_blank" rel="noopener"
     class="animate-fade-up group rounded-2xl border border-zinc-200 bg-white p-4 transition duration-200 hover:-translate-y-0.5 hover:border-zinc-300 hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
     [class.pointer-events-none]="!a.url" [style.animation-delay.ms]="(i < 8 ? i : 8) * 35">
    <div class="flex h-28 items-center justify-center rounded-xl bg-zinc-100 text-zinc-500 transition group-hover:bg-brand-50 group-hover:text-brand-700"><i class="ph text-4xl" [ngClass]="'ph-' + icono(a.documento)"></i></div>
    <p class="mt-3 truncate text-sm font-semibold" [title]="a.documento">{{ a.documento }}</p>
    <p class="text-xs text-zinc-500">{{ tamano(a.tamano) }}{{ a.tamano ? ' · ' : '' }}{{ a.fecha_insercion | date: 'dd/MM/yyyy' }}</p>
  </a>
</div>
